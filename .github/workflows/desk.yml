name: Wallex Desk (generate + post)
on:
  schedule:
    - cron: '35 6 * * *'    # 10:05 Tehran
    - cron: '35 15 * * *'   # 19:05 Tehran
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: wallex-desk
  cancel-in-progress: false
jobs:
  desk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate posts and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WRITE: '1'
          SEND: '1'
        run: node telegram/generate.js
      - name: Commit snapshot and archive
        run: |
          set -e
          git config user.name "wallex-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add telegram/state/snapshot.json telegram/archive 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "desk: update snapshot + archive [skip ci]"
            git push
          fi
